# The Unix specifics of CK-AppIdentity, read by the run-tests.sh of the Stack (Tools/Unix): the store permissions
# (owner-only 0700/0600 private store, setgid group shared store, umask correction) and the FileLock (a direct
# flock(2) that must work even when DOTNET_SYSTEM_IO_DISABLEFILELOCKING=1).
projects=( "Tests/CK.AppIdentity.Tests" )
# "default": the regular run; "no-dotnet-locking": the .NET FileShare emulation is disabled, the store locks must still
# exclude each other; "umask-027": a restrictive umask must not narrow the group permissions of a shared store.
passes=( "default 022" "no-dotnet-locking 022 DOTNET_SYSTEM_IO_DISABLEFILELOCKING=1" "umask-027 027" )
# Each pass starts with a fresh test store.
fresh=( "TestStore" )
